# Compila el sitio con Jekyll (incluido el plugin de la versión en inglés) y lo publica en GitHub Pages.
# Se ejecuta en cada cambio (también los que se guardan desde Pages CMS).
# En otras ramas solo compila, como prueba; publica únicamente desde main.
name: Compilar y publicar el sitio

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Compilar con Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Comprobar páginas clave
        run: |
          for f in index.html en/index.html sitemap.xml robots.txt investigadores/alfonso-garcia-vela/index.html en/investigadores/alfonso-garcia-vela/index.html; do
            test -s "_site/$f" || { echo "Falta _site/$f"; exit 1; }
          done
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
