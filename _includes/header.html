<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Crítica Inmanente">
      <img src="{{ '/assets/img/logo.png' | relative_url }}" alt="Crítica Inmanente" width="190" height="64">
    </a>
    <div class="header-tools">
      <button class="lang-toggle" type="button" title="Cambiar idioma / Change language"><span class="l-es" lang="en">EN</span><span class="l-en" lang="es">ES</span></button>
      <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Menú / Menu">
      <label for="nav-toggle" class="nav-button" aria-hidden="true"><span></span><span></span><span></span></label>
      <nav class="site-nav" aria-label="Menú principal">
        <ul>
          {% for item in site.data.menu.items %}
          {% assign activo = false %}{% if page.url contains item.url %}{% assign activo = true %}{% endif %}
          <li><a href="{{ item.url | relative_url }}"{% if activo %} aria-current="page"{% endif %}>{% include t.html es=item.titulo en=item.titulo_en %}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</header>
