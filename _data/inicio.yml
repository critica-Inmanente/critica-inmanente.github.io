etiqueta: Teoría crítica de la sociedad
etiqueta_en: Critical theory of society
cita: "Es preciso fijar perspectivas en las que el mundo aparezca trastocado, enajenado, mostrando sus grietas y desgarros, menesteroso y deforme en el grado en que aparece bajo la luz mesiánica. Situarse en tales perspectivas sin arbitrariedad ni violencia, desde el contacto con los objetos, sólo le es dado al pensamiento. Y es la cosa más sencilla, porque la situación misma incita perentoriamente a tal conocimiento, más aún, porque la negatividad consumada, cuando se la tiene a la vista sin recortes, compone la imagen invertida de lo contrario a ella."
cita_en: ""
cita_autor: Theodor W. Adorno
cita_obra: Minima moralia
cita_obra_en: Minima Moralia
presentacion: "Somos un grupo de pensadores e investigadores que comprenden la labor del pensamiento como un ejercicio reflexivo y crítico que no puede estar desvinculado de la praxis por la transformación social."
eventos_texto: "Consulta nuestros próximos foros, coloquios y conversatorios en modalidad híbrida."
presentacion_en: "We are a group of thinkers and researchers who understand the work of thought as a reflexive and critical exercise that cannot be separated from the praxis of social transformation."
eventos_texto_en: "Check our upcoming forums, colloquia and conversations, held in hybrid format."
