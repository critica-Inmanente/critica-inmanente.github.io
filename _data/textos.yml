# Integrantes
integrantes_titulo:
  es: Integrantes
  en: Members
integrantes_intro:
  es: El núcleo de Crítica Inmanente está conformado por un colectivo de académicos e investigadores comprometidos con la actualización de la teoría crítica, el análisis de la totalidad social y los procesos de emancipación.
  en: The core of Crítica Inmanente is a collective of scholars and researchers committed to renewing critical theory, to the analysis of the social totality and to processes of emancipation.

# Difusión
difusion_titulo:
  es: Difusión
  en: Outreach
difusion_intro:
  es: Compartimos el material audiovisual, sonoro y ensayístico generado por el grupo de investigación. Un espacio de divulgación y análisis crítico en torno a la teoría, la cultura y la praxis social.
  en: Audiovisual, audio and essay material produced by the research group. A space for outreach and critical analysis of theory, culture and social praxis.
difusion_vacio:
  es: Muy pronto compartiremos aquí podcasts, videos y otros materiales.
  en: Podcasts, videos and other materials will be shared here very soon.
difusion_ver:
  es: Ver o escuchar
  en: Watch or listen

