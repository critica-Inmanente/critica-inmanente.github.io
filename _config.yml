# Configuración general del sitio Crítica Inmanente
title: Crítica Inmanente
description: "Grupo de investigación en teoría crítica de la sociedad: Escuela de Frankfurt, nuevas lecturas de Marx y crítica del capitalismo contemporáneo."
description_en: "Research group on the critical theory of society: the Frankfurt School, new readings of Marx and the critique of contemporary capitalism."
lang: es
timezone: America/Mexico_City

# Dirección del sitio (dominio propio criticainmanente.org).
url: "https://criticainmanente.org"
baseurl: ""

# Estadísticas de visitas (GoatCounter). Código de la cuenta: https://CODIGO.goatcounter.com
goatcounter: criticainmanente

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]

# jekyll-sitemap genera /sitemap.xml y /robots.txt. Las etiquetas de buscadores y los
# datos estructurados (JSON-LD) se generan en _includes/seo.html y _includes/jsonld.html.
plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

collections:
  # Una página por obra: /publicaciones/<slug>/
  libros:
    output: true
    permalink: /publicaciones/:slug/
  investigaciones:
    output: true
    permalink: /publicaciones/:slug/
  # Una página por integrante: /investigadores/<slug>/
  integrantes:
    output: true
    permalink: /investigadores/:slug/
  eventos:
    output: false
  difusion:
    output: false

defaults:
  - scope:
      path: ""
      type: libros
    values:
      layout: publicacion
  - scope:
      path: ""
      type: investigaciones
    values:
      layout: publicacion
  - scope:
      path: ""
      type: integrantes
    values:
      layout: perfil
  - scope:
      path: ""
      type: posts
    values:
      layout: entrada
      permalink: /entradas/:year/:title/

exclude:
  - README.md
  - vendor
  - .bundle
  - .github
  - .pages.yml
  - docs
  - Gemfile
  - Gemfile.lock
