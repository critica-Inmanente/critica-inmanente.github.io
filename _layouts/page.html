---
layout: default
---
<section class="page-head">
  <div class="wrap">
    <div class="page-head-inner">
      <h1>{{ page.encabezado | default: page.title }}</h1>
      {% if page.intro %}<p class="lead">{{ page.intro }}</p>{% endif %}
    </div>
  </div>
</section>
<section class="page-body">
  <div class="wrap {% if page.path contains '.md' %}narrow{% endif %}">
    {{ content }}
  </div>
</section>
