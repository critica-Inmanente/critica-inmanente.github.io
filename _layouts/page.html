---
layout: default
---
<section class="page-head">
  <div class="wrap">
    <h1>{{ page.encabezado | default: page.title }}</h1>
    {% if page.intro %}<p class="lead">{{ page.intro }}</p>{% endif %}
  </div>
</section>
<section class="page-body">
  <div class="wrap {% if page.ancho == 'texto' or page.layout_ancho == 'texto' %}narrow{% endif %}">
    {{ content }}
  </div>
</section>
